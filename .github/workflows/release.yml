name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag version v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="prompt-sage-${GITHUB_REF_NAME}/" -o "dist/prompt-sage-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          sha256sum "prompt-sage-${GITHUB_REF_NAME}.tar.gz" > "prompt-sage-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/prompt-sage-${{ github.ref_name }}.tar.gz
            dist/prompt-sage-${{ github.ref_name }}.tar.gz.sha256
