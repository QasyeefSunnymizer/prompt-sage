name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag version v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build source archive
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="prompt-sage-${GITHUB_REF_NAME}/" -o "dist/prompt-sage-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          sha256sum "prompt-sage-${GITHUB_REF_NAME}.tar.gz" > "prompt-sage-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Upload source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            dist/prompt-sage-${{ github.ref_name }}.tar.gz
            dist/prompt-sage-${{ github.ref_name }}.tar.gz.sha256

  rust-binaries:
    needs: validate-and-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: prompt-sage-rs
            out: prompt-sage-rs-linux-x64
          - os: macos-latest
            bin: prompt-sage-rs
            out: prompt-sage-rs-macos-x64
          - os: windows-latest
            bin: prompt-sage-rs.exe
            out: prompt-sage-rs-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary
        shell: bash
        run: cargo build --release --manifest-path rust/prompt-sage-rs/Cargo.toml

      - name: Package Rust binary
        shell: bash
        run: |
          mkdir -p dist
          cp "rust/prompt-sage-rs/target/release/${{ matrix.bin }}" "dist/${{ matrix.out }}"

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.out }}
          path: dist/${{ matrix.out }}

  publish-release:
    needs: [validate-and-source, rust-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Download source artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-source
          path: dist

      - name: Download Rust artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rust-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
