[package]
name = "prompt-sage-rs"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Prompt Sage token-efficient CLI"

[[bin]]
name = "prompt-sage"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.9", features = ["derive"] }
regex = "1.10.5"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
